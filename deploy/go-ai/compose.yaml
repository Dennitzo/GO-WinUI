name: go-ai-server

services:
  caddy:
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    container_name: go-ai-caddy
    network_mode: host
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${GO_AI_DATA_ROOT:?GO_AI_DATA_ROOT is required}/Caddy/data:/data
      - ${GO_AI_DATA_ROOT:?GO_AI_DATA_ROOT is required}/Caddy/config:/config
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "--quiet", "https://${GO_AI_EXPECTED_LAN_IP:-192.168.0.67}:8443/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  searxng:
    image: searxng/searxng@sha256:c2dc2d9e6b910653e8628361c23443222490e4cabbb9e02667b7847143db843b
    container_name: go-ai-searxng
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:7081:8080"
    volumes:
      - ${GO_AI_DATA_ROOT:?GO_AI_DATA_ROOT is required}/Config/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ${GO_AI_DATA_ROOT:?GO_AI_DATA_ROOT is required}/Cache/searxng:/var/cache/searxng
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:7081/
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - research
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  worker-edge:
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    container_name: go-ai-worker-edge
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:7082:7082"
      - "127.0.0.1:7083:7083"
      - "127.0.0.1:7084:7084"
      - "127.0.0.1:7085:7085"
    volumes:
      - ./caddy/WorkerEdge.Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /config:size=8m,mode=0700,uid=10001,gid=10001
      - /data:size=8m,mode=0700,uid=10001,gid=10001
    networks:
      - edge
      - workers
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  speech:
    image: go-ai/speech:${GO_AI_IMAGE_VERSION:-1.0.0}
    build:
      context: ../../workers
      dockerfile: speech/Dockerfile
    container_name: go-ai-speech
    restart: "no"
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${GO_AI_DATA_ROOT:?GO_AI_DATA_ROOT is required}/Models:/models:ro
      - ${GO_AI_DATA_ROOT:?GO_AI_DATA_ROOT is required}/Uploads:/data/Uploads:ro
      - ${GO_AI_DATA_ROOT:?GO_AI_DATA_ROOT is required}/Artifacts/worker:/data/Artifacts/worker
      - ${GO_AI_DATA_ROOT:?GO_AI_DATA_ROOT is required}/Voices:/data/Voices:ro
    secrets:
      - source: speech_worker_key
        target: worker_key
    environment:
      GO_AI_WORKER_KEY_FILE: /run/secrets/worker_key
      GO_AI_WHISPER_MODEL: /models/faster-whisper-large-v3
      GO_AI_SPEAKER_MODEL: /models/spkrec-ecapa-voxceleb
      GO_AI_PRELOAD_STT: "0"
      GO_AI_MODEL_TTL_SECONDS: "600"
      GO_AI_TTS_MODEL: /models/piper/de_DE-kerstin-low/de_DE-kerstin-low.onnx
      GO_AI_TTS_CONFIG: /models/piper/de_DE-kerstin-low/de_DE-kerstin-low.onnx.json
      CUDA_VISIBLE_DEVICES: "0"
      NUMBA_CACHE_DIR: /tmp/numba-cache
      XDG_CACHE_HOME: /tmp/cache
      TORCH_HOME: /tmp/torch
      NVIDIA_VISIBLE_DEVICES: all
    gpus: all
    shm_size: "2gb"
    mem_limit: 32g
    pids_limit: 512
    tmpfs:
      - /tmp:size=4g,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - workers
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  media:
    image: go-ai/media:${GO_AI_IMAGE_VERSION:-1.0.0}
    build:
      context: ../../workers
      dockerfile: media/Dockerfile
    container_name: go-ai-media
    restart: "no"
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${GO_AI_DATA_ROOT:?GO_AI_DATA_ROOT is required}/Uploads:/data/Uploads:ro
      - ${GO_AI_DATA_ROOT:?GO_AI_DATA_ROOT is required}/Artifacts/worker:/data/Artifacts/worker
    secrets:
      - source: media_worker_key
        target: worker_key
    environment:
      GO_AI_WORKER_KEY_FILE: /run/secrets/worker_key
    mem_limit: 8g
    pids_limit: 256
    tmpfs:
      - /tmp:size=6g,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - workers
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  image:
    image: go-ai/image:${GO_AI_IMAGE_VERSION:-1.0.0}
    build:
      context: ../../workers
      dockerfile: image/Dockerfile
      args:
        STABLE_DIFFUSION_CPP_COMMIT: de298c225bed97c3f9026b73cd7b71e7879bd41b
    container_name: go-ai-image
    restart: "no"
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${GO_AI_DATA_ROOT:?GO_AI_DATA_ROOT is required}/Models:/models:ro
      - ${GO_AI_DATA_ROOT:?GO_AI_DATA_ROOT is required}/Artifacts/worker:/data/Artifacts/worker
    secrets:
      - source: image_worker_key
        target: worker_key
    environment:
      GO_AI_WORKER_KEY_FILE: /run/secrets/worker_key
      GO_AI_Z_IMAGE_MODEL: /models/z-image/z_image_turbo-Q4_K.gguf
      GO_AI_Z_IMAGE_VAE: /models/z-image/ae.safetensors
      GO_AI_Z_IMAGE_ENCODER: /models/z-image/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
      GO_AI_PRELOAD_IMAGE: "0"
      GO_AI_MODEL_TTL_SECONDS: "600"
      GO_AI_IMAGE_LOAD_TIMEOUT_SECONDS: "1200"
      CUDA_VISIBLE_DEVICES: "1"
      NVIDIA_VISIBLE_DEVICES: all
    gpus: all
    shm_size: "2gb"
    mem_limit: 24g
    pids_limit: 256
    tmpfs:
      - /tmp:size=4g,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - workers
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    driver: bridge
  research:
    driver: bridge
  workers:
    driver: bridge
    internal: true

secrets:
  speech_worker_key:
    file: ${GO_AI_DATA_ROOT:?GO_AI_DATA_ROOT is required}/Secrets/speech-worker.key
  media_worker_key:
    file: ${GO_AI_DATA_ROOT:?GO_AI_DATA_ROOT is required}/Secrets/media-worker.key
  image_worker_key:
    file: ${GO_AI_DATA_ROOT:?GO_AI_DATA_ROOT is required}/Secrets/image-worker.key
